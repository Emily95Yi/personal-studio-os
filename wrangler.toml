name = "yistudio-private"
main = "worker/index.js"
compatibility_date = "2026-11-05"
workers_dev = true
preview_urls = false
keep_vars = true

[vars]
STUDIO_ORIGIN = "https://yistudio-private.cho-eki0915.workers.dev"
# Enable only after configuring the exact /api/capture/mobile Access paths.
# CAPTURE_MOBILE = "1"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = false

# Use the ignored wrangler.production.toml for production with the verified DB ID.
[[d1_databases]]
binding = "DB"
database_name = "yistudio-private"
database_id = "00000000-0000-0000-0000-000000000000"

# For an isolated sync preview, bind an R2 bucket named STUDIO_CONTENT.
# Keep the production bucket name in the ignored deployment config.
# [[r2_buckets]]
# binding = "STUDIO_CONTENT"
# bucket_name = "yistudio-content-preview"

[triggers]
crons = ["*/5 * * * *"]
